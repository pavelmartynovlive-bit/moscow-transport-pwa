<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0e" />
    <meta name="description" content="Ближайшие автобусы на двух остановках у школы № 508." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Автобусы" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Автобусы у школы № 508</title>
  </head>
  <body>
    <main class="board-shell">
      <header class="topbar">
        <h1>Школа № 508</h1>
        <div class="clock-wrap">
          <span class="status-dot loading" id="status-dot" aria-label="Обновляем данные" title="Обновляем данные"></span>
          <time id="clock">--:--:--</time>
        </div>
      </header>

      <div class="stop-grid" id="board" aria-live="polite">
        <div class="stop-card skeleton"></div>
        <div class="stop-card skeleton"></div>
      </div>

      <footer>
        <button id="refresh" type="button">Обновить</button>
      </footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
